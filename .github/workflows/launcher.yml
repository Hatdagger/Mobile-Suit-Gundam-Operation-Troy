# Builds the launcher ("Operation Troy.exe"). It holds no game code or assets.
# Download it from the run's Artifacts section (Actions tab -> latest "Launcher" run).
name: Launcher

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get SDL3, Dear ImGui and rapidjson (the only SDK libraries the launcher uses; fmt for the test tool)
        run: git submodule update --init --depth 1 thirdparty/rexglue-sdk/thirdparty/sdl3 thirdparty/rexglue-sdk/thirdparty/imgui thirdparty/rexglue-sdk/thirdparty/rapidjson thirdparty/rexglue-sdk/thirdparty/fmt

      - name: Configure
        run: cmake -S launcher -B out/launcher -A x64 -DOPTROY_LAUNCHER_TOOL=ON

      - name: Build
        run: cmake --build out/launcher --config Release --parallel

      - name: LAN server test (match server + LAN search, on Windows)
        shell: pwsh
        run: |
          cmake -S tools/netcheck -B out/netcheck -A x64
          cmake --build out/netcheck --config Release --parallel
          $server = Start-Process "out/launcher/Release/optroy_launcher_tool.exe" -ArgumentList "lan-server","36000","36001","300" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          out/netcheck/Release/optroy_netcheck.exe selftest http://127.0.0.1:36000
          $code = $LASTEXITCODE
          out/launcher/Release/optroy_launcher_tool.exe lan-scan 36001 127.0.0.1
          if ($LASTEXITCODE -ne 0) { $code = 1 }
          Stop-Process -Id $server.Id
          exit $code

      - name: English patch test (.zip unpacked with Windows' tar, xdelta apply / remove / re-apply)
        shell: pwsh
        run: python launcher/tests/english_patch_test.py out/launcher/Release/optroy_launcher_tool.exe "$env:RUNNER_TEMP/english_patch_test"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "out/launcher/Release/Operation Troy.exe" dist/
          New-Item -ItemType Directory -Force -Path dist/licenses | Out-Null
          Copy-Item launcher/fonts/OFL-*.txt dist/licenses/
          Copy-Item thirdparty/rexglue-sdk/thirdparty/sdl3/LICENSE.txt dist/licenses/SDL3-LICENSE.txt
          Copy-Item thirdparty/rexglue-sdk/thirdparty/imgui/LICENSE.txt dist/licenses/DearImGui-LICENSE.txt
          Copy-Item thirdparty/rexglue-sdk/thirdparty/rapidjson/license.txt dist/licenses/RapidJSON-LICENSE.txt
          Copy-Item launcher/thirdparty/xdelta3/LICENSE dist/licenses/xdelta3-LICENSE.txt
          Copy-Item launcher/README.md dist/README-launcher.md

      - uses: actions/upload-artifact@v4
        with:
          name: OperationTroy-Launcher-Windows-x64
          path: dist/
          if-no-files-found: error
